<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment — Momently</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <header class="navbar scrolled">
    <div class="container navbar-inner">
      <a href="index.html" class="wordmark">Momently</a>
      <nav class="nav-links"></nav>
      <div class="nav-actions"><span data-auth-slot></span></div>
    </div>
  </header>

  <main class="pay-shell">
    <div class="pay-card">
      <span class="eyebrow">Payment</span>
      <h1 id="pay-title" style="font-size:24px;">Loading order…</h1>
      <p class="pay-amount" id="pay-amount"></p>
      <p style="font-size:13.5px; color: rgba(18,16,15,0.55);" id="pay-subtitle"></p>

      <button type="button" class="btn btn-primary btn-block mt-24" id="pay-btn" disabled>Pay Now</button>
      <p class="pay-status" id="pay-status"></p>
      <p style="font-size:12px; color: rgba(18,16,15,0.4); margin-top:18px;">Payments are processed securely by Razorpay. Momently never sees your card details.</p>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
