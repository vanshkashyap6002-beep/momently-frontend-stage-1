<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Memory — Momently</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <header class="navbar scrolled">
    <div class="container navbar-inner">
      <a href="index.html" class="wordmark">Momently</a>
      <nav class="nav-links"></nav>
      <div class="nav-actions"><span data-auth-slot></span></div>
    </div>
  </header>

  <main class="step-shell">
    <p class="eyebrow" id="template-context">Loading template…</p>
    <div class="step-progress">
      <span class="active" data-step-dot="1"></span>
      <span data-step-dot="2"></span>
      <span data-step-dot="3"></span>
    </div>

    <div id="form-banner"></div>

    <!-- Step 1: Customer information -->
    <section class="step-panel active" data-step="1">
      <h2>Tell us about this memory</h2>
      <p class="step-desc">Just enough for us to start building your page.</p>
      <form id="info-form">
        <div class="field">
          <label for="recipientName">Who is this for? (partner / friend / family member's name)</label>
          <input type="text" id="recipientName" name="recipientName" required placeholder="e.g. Priya">
        </div>
        <div class="field">
          <label for="memoryTitle">Memory title</label>
          <input type="text" id="memoryTitle" name="memoryTitle" required placeholder="e.g. Happy Anniversary, Priya!">
        </div>
        <div class="field">
          <label for="importantDate">Important date (optional)</label>
          <input type="date" id="importantDate" name="importantDate">
        </div>
        <div class="field">
          <label for="personalMessage">Your story / personal message</label>
          <textarea id="personalMessage" name="personalMessage" rows="5" placeholder="Tell us the story you want this page to hold…"></textarea>
        </div>
        <div class="step-nav">
          <span></span>
          <button type="submit" class="btn btn-primary" id="step1-next">Continue →</button>
        </div>
      </form>
    </section>

    <!-- Step 2: Upload photos/media -->
    <section class="step-panel" data-step="2">
      <h2>Add your photos & media</h2>
      <p class="step-desc">JPEG, PNG, WebP, or short video — up to 10 files.</p>

      <div class="upload-zone" id="upload-zone" tabindex="0" role="button" aria-label="Upload photos or video">
        <div style="font-size:28px;">⇧</div>
        <p><strong>Click to upload</strong> or drag and drop</p>
      </div>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple class="visually-hidden">
      <div class="upload-previews" id="upload-previews"></div>

      <div class="step-nav">
        <button type="button" class="btn btn-ghost" data-step-prev>← Back</button>
        <button type="button" class="btn btn-primary" id="step2-next">Continue →</button>
      </div>
    </section>

    <!-- Step 3: Order summary -->
    <section class="step-panel" data-step="3">
      <h2>Order summary</h2>
      <p class="step-desc">Check the details, then head to payment.</p>
      <div id="summary-content"></div>
      <div class="step-nav">
        <button type="button" class="btn btn-ghost" data-step-prev>← Back</button>
        <button type="button" class="btn btn-primary" id="proceed-payment">Proceed to Payment →</button>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/create-memory.js"></script>
</body>
</html>
