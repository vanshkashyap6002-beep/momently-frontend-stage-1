<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Momently</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <header class="navbar scrolled">
    <div class="container navbar-inner">
      <a href="index.html" class="wordmark">Momently</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="templates.html">Marketplace</a>
      </nav>
      <div class="nav-actions"></div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="wordmark">Momently</a>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to continue your memory.</p>

      <div id="form-banner"></div>

      <button type="button" class="btn btn-google btn-block" id="google-btn" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>
      <div class="auth-divider" id="google-divider" style="display:none;">or</div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log In</button>
      </form>

      <p class="auth-switch">New to Momently? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <!-- Login success overlay: ❤️ Welcome Back / Loading your memories… (~800ms) -->
  <div class="welcome-transition" id="welcome-transition" style="display:none;">
    <div>
      <div class="welcome-heart">❤️</div>
      <h2>Welcome Back</h2>
      <p>Loading your memories…</p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
